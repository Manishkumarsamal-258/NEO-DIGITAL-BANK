# ── NeoBank Docker Compose ─────────────────────────────────
# Spins up the full stack: frontend (Nginx), backend (Spring Boot), MySQL.
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose down           # Stop all services
#   docker compose up -d --build  # Rebuild and start

services:
  # ── Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: neobank-frontend:latest
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - neobank-network

  # ── Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./neobank-backend
    image: neobank-backend:latest
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/neobank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-neobank_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-neobank_pass}
      JWT_SECRET: ${JWT_SECRET:-neobank-secret-key-change-in-production}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - neobank-network

  # ── MySQL Database ───────────────────────────────────────
  db:
    image: mysql:8.0
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: neobank
      MYSQL_USER: ${MYSQL_USER:-neobank_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-neobank_pass}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - neobank-network

volumes:
  mysql-data:

networks:
  neobank-network:
    driver: bridge
