# ── Server ────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── MySQL Database ────────────────────────────────────────
# Railway provides SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# via the MySQL plugin. In local dev, it falls back to localhost.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/neobank?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Manish@258}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ───────────────────────────────────────────────────
# Set JWT_SECRET env var in production to a secure random string
app.jwt.secret=${JWT_SECRET:NeoBankSuperSecretKey2024ForJWTTokenGenerationMustBe256BitsLong}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── CORS ──────────────────────────────────────────────────
# Comma-separated list of allowed origins (set APP_CORS_ORIGINS for Railway/Vercel)
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5174}

# ── Jackson ───────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.time-zone=UTC

# ── Actuator (health check) ───────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
